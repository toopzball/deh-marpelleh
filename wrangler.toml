name = "deh-marpelleh"
main = "worker.js"
compatibility_date = "2025-01-01"

# دو تا Secret رو جدا از این فایل، با wrangler secret put ست کن (توضیح بالایِ worker.js):
#   MAIN_API_BASE, INTERNAL_KEY

[[durable_objects.bindings]]
